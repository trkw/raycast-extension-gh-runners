name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/gh-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extensions/gh-runners/package-lock.json
      - run: npm ci
      - name: eslint
        run: npx eslint src
      - name: prettier
        run: npx prettier --check src
      - name: build
        run: npx ray build -e dist
